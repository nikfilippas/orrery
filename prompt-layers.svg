<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 606" width="1180" height="606" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="What Orrery sends: one typed prompt, the standing instruction a principal session already carries, and the bounded handoff a delegated role receives instead of the user's words">
<rect width="1180" height="606" fill="#0c2029"/>
<text x="28" y="40" font-size="20" font-weight="600" fill="#dfe6ea">What actually reaches the model</text>
<text x="28" y="63" font-size="13" fill="#8fa0aa">Read from the installed kit at build time. One typed line arrives wrapped in standing instruction; a delegate never sees the typed line at all.</text>
<rect x="28" y="92" width="340" height="440" rx="10" ry="10" fill="#0f2733" stroke="#1d3440" stroke-width="1.5"/><text x="46" y="122" font-size="16" font-weight="600" fill="#dfe6ea">You type</text><text x="46" y="143" font-size="12.5" fill="#8fa0aa">one line, in your own words</text>
<rect x="44" y="166" width="308" height="52" rx="6" ry="6" fill="#16323f" stroke="#ac8f5f" stroke-width="1.3"/><text x="56" y="197" font-size="13.5" fill="#dfe6ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">add a --top flag with tests</text>
<text x="44" y="250" font-size="12" fill="#8fa0aa">That is the whole of your input. Everything</text><text x="44" y="268" font-size="12" fill="#8fa0aa">to the right is added for you, and is the</text><text x="44" y="286" font-size="12" fill="#8fa0aa">same on every run.</text>
<rect x="412" y="92" width="340" height="440" rx="10" ry="10" fill="#0f2733" stroke="#1d3440" stroke-width="1.5"/><text x="430" y="122" font-size="16" font-weight="600" fill="#dfe6ea">The principal receives</text><text x="430" y="143" font-size="12.5" fill="#8fa0aa">your session, before it answers</text>
<rect x="428" y="164" width="308" height="34" rx="6" ry="6" fill="#6d8ba622" stroke="#6d8ba6" stroke-width="1.2"/><text x="440" y="180" font-size="12.5" font-weight="600" fill="#dfe6ea">global/AGENTS.md</text><text x="440" y="192" font-size="10.5" fill="#8fa0aa">shared policy, via ~/.claude/AGENTS.md</text><text x="724" y="186" font-size="11" fill="#ac8f5f" text-anchor="end">370 lines</text>
<rect x="428" y="206" width="308" height="34" rx="6" ry="6" fill="#6d8ba622" stroke="#6d8ba6" stroke-width="1.2"/><text x="440" y="222" font-size="12.5" font-weight="600" fill="#dfe6ea">global/CLAUDE.md</text><text x="440" y="234" font-size="10.5" fill="#8fa0aa">a one-line @AGENTS.md import</text><text x="724" y="228" font-size="11" fill="#ac8f5f" text-anchor="end">1 line</text>
<rect x="428" y="248" width="308" height="34" rx="6" ry="6" fill="#88907f22" stroke="#88907f" stroke-width="1.2"/><text x="440" y="264" font-size="12.5" font-weight="600" fill="#dfe6ea">repository AGENTS.md</text><text x="440" y="276" font-size="10.5" fill="#8fa0aa">per-repo rules, from orrery-init</text><text x="724" y="270" font-size="11" fill="#ac8f5f" text-anchor="end">~54 lines</text>
<rect x="428" y="290" width="308" height="34" rx="6" ry="6" fill="#ad7a2f22" stroke="#ad7a2f" stroke-width="1.2"/><text x="440" y="306" font-size="12.5" font-weight="600" fill="#dfe6ea">SessionStart hook</text><text x="440" y="318" font-size="10.5" fill="#8fa0aa">adoption gate, principal check, plan-review cap</text><text x="724" y="312" font-size="11" fill="#ac8f5f" text-anchor="end">injected</text>
<rect x="428" y="332" width="308" height="34" rx="6" ry="6" fill="#9aa0b322" stroke="#9aa0b3" stroke-width="1.2"/><text x="440" y="348" font-size="12.5" font-weight="600" fill="#dfe6ea">development-orchestrator</text><text x="440" y="360" font-size="10.5" fill="#8fa0aa">the routing procedure, loaded on demand</text><text x="724" y="354" font-size="11" fill="#ac8f5f" text-anchor="end">297 lines</text>
<rect x="428" y="374" width="308" height="34" rx="6" ry="6" fill="#ac8f5f22" stroke="#ac8f5f" stroke-width="1.2"/><text x="440" y="390" font-size="12.5" font-weight="600" fill="#dfe6ea">your prompt</text><text x="440" y="402" font-size="10.5" fill="#8fa0aa">verbatim, last</text><text x="724" y="396" font-size="11" fill="#ac8f5f" text-anchor="end">1 line</text>
<text x="428" y="430" font-size="12" fill="#8fa0aa">Roughly 721 lines of standing instruction</text><text x="428" y="448" font-size="12" fill="#8fa0aa">stand behind your one line.</text>
<rect x="796" y="92" width="340" height="440" rx="10" ry="10" fill="#0f2733" stroke="#1d3440" stroke-width="1.5"/><text x="814" y="122" font-size="16" font-weight="600" fill="#dfe6ea">A delegated role receives</text><text x="814" y="143" font-size="12.5" fill="#8fa0aa">a separate process, fresh context</text>
<rect x="812" y="164" width="308" height="34" rx="6" ry="6" fill="#6d8ba622" stroke="#6d8ba6" stroke-width="1.2"/><text x="824" y="180" font-size="12.5" font-weight="600" fill="#dfe6ea">the same standing policy</text><text x="824" y="192" font-size="10.5" fill="#8fa0aa">global and repository instructions, unchanged</text><text x="1108" y="186" font-size="11" fill="#ac8f5f" text-anchor="end">identical</text>
<rect x="812" y="206" width="308" height="34" rx="6" ry="6" fill="#ad7a2f22" stroke="#ad7a2f" stroke-width="1.2"/><text x="824" y="222" font-size="12.5" font-weight="600" fill="#dfe6ea">SessionStart, silenced</text><text x="824" y="234" font-size="10.5" fill="#8fa0aa">“bounded, non-principal: follow the handoff”</text><text x="1108" y="228" font-size="11" fill="#ac8f5f" text-anchor="end">injected</text>
<rect x="812" y="248" width="308" height="138" rx="6" ry="6" fill="#ac8f5f18" stroke="#ac8f5f" stroke-width="1.4"/><text x="824" y="268" font-size="12.5" font-weight="600" fill="#ac8f5f">ORRERY ROLE HANDOFF</text>
<text x="832" y="288" font-size="11" fill="#8fa0aa">· Role: &lt;id&gt;</text>
<text x="832" y="305" font-size="11" fill="#8fa0aa">· bounded, non-principal: do not delegate or spawn</text>
<text x="832" y="322" font-size="11" fill="#8fa0aa">· access: read-only, or workspace-write</text>
<text x="832" y="339" font-size="11" fill="#8fa0aa">· comment contract (read-only roles only)</text>
<text x="832" y="356" font-size="11" fill="#8fa0aa">· report style, from the manifest's verbosity dial</text>
<text x="832" y="373" font-size="11" fill="#dfe6ea">· the assignment</text>
<rect x="812" y="396" width="308" height="34" rx="6" ry="6" fill="#9aa0b322" stroke="#9aa0b3" stroke-width="1.2"/><text x="824" y="412" font-size="12.5" font-weight="600" fill="#dfe6ea">provider flags</text><text x="824" y="424" font-size="10.5" fill="#8fa0aa">model, thinking, sandbox, no fallback ladder</text><text x="1108" y="418" font-size="11" fill="#ac8f5f" text-anchor="end">argv</text>
<text x="812" y="442" font-size="12" fill="#8fa0aa">It never sees your words, only the bounded</text><text x="812" y="460" font-size="12" fill="#8fa0aa">assignment. It cannot delegate further.</text>
<path d="M368 192L403 192" stroke="#ac8f5f" stroke-width="1.6" fill="none"/><path d="M412 192l-9 -4.5v9z" fill="#ac8f5f"/><text x="390.0" y="183" font-size="11" fill="#ac8f5f" text-anchor="middle">wrapped</text>
<path d="M752 192L787 192" stroke="#ac8f5f" stroke-width="1.6" fill="none"/><path d="M796 192l-9 -4.5v9z" fill="#ac8f5f"/><text x="774.0" y="183" font-size="11" fill="#ac8f5f" text-anchor="middle">bounded</text>
<text x="28" y="576" font-size="11.5" fill="#8fa0aa">The principal is accountable for the result; a delegate is given one task, one access mode, and no authority to hand it on. Nothing here is hidden from you: every file above is readable in the repository.</text>
</svg>
