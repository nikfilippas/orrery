<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1202 801" width="1202" height="801" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="What Orrery sends: one typed prompt, the standing instruction a principal session already carries, and the bounded handoff a delegated role receives instead of the user's words">
<rect width="1202" height="801" fill="#0c2029"/>
<text x="26" y="44" font-size="24" font-weight="600" fill="#dfe6ea">What actually reaches the model</text>
<text x="26" y="70" font-size="15.5" fill="#8fa0aa">Read from the installed kit at build time. One typed line arrives wrapped in standing instruction; a delegate never sees it at all.</text>
<rect x="26" y="318.5" width="322" height="232" rx="10" ry="10" fill="#0f2733" stroke="#1d3440" stroke-width="1.5"/><text x="44" y="351.5" font-size="19" font-weight="600" fill="#dfe6ea">You type</text><text x="44" y="374.5" font-size="14.5" fill="#8fa0aa">one line, in your own words</text>
<g transform="translate(26 318)"><rect x="16" y="82" width="290" height="56" rx="6" ry="6" fill="#16323f" stroke="#ac8f5f" stroke-width="1.3"/><text x="28" y="116" font-size="16" fill="#dfe6ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">add a --top flag with tests</text><text x="16" y="170" font-size="14.5" fill="#8fa0aa">That is the whole of your input.</text><text x="16" y="189" font-size="14.5" fill="#8fa0aa">Everything to the right is added</text><text x="16" y="208" font-size="14.5" fill="#8fa0aa">for you, and is the same every run.</text></g>
<rect x="440" y="134.0" width="322" height="601.0" rx="10" ry="10" fill="#0f2733" stroke="#1d3440" stroke-width="1.5"/><text x="458" y="167.0" font-size="19" font-weight="600" fill="#dfe6ea">The principal receives</text><text x="458" y="190.0" font-size="14.5" fill="#8fa0aa">your session, before it answers</text>
<g transform="translate(440 134)"><rect x="16" y="80" width="290" height="77" rx="6" ry="6" fill="#6d8ba622" stroke="#6d8ba6" stroke-width="1.2"/><text x="28" y="101" font-size="15" font-weight="600" fill="#dfe6ea">global/AGENTS.md</text><text x="28" y="119" font-size="13.5" fill="#8fa0aa">shared policy, via</text><text x="28" y="137" font-size="13.5" fill="#8fa0aa">~/.claude/AGENTS.md</text><text x="294" y="101" font-size="13.5" fill="#ac8f5f" text-anchor="end">370 lines</text><rect x="16" y="167.0" width="290" height="59" rx="6" ry="6" fill="#6d8ba622" stroke="#6d8ba6" stroke-width="1.2"/><text x="28" y="188.0" font-size="15" font-weight="600" fill="#dfe6ea">global/CLAUDE.md</text><text x="28" y="206" font-size="13.5" fill="#8fa0aa">a one-line @AGENTS.md import</text><text x="294" y="188.0" font-size="13.5" fill="#ac8f5f" text-anchor="end">1 line</text><rect x="16" y="236.0" width="290" height="59" rx="6" ry="6" fill="#88907f22" stroke="#88907f" stroke-width="1.2"/><text x="28" y="257.0" font-size="15" font-weight="600" fill="#dfe6ea">repository AGENTS.md</text><text x="28" y="275" font-size="13.5" fill="#8fa0aa">per-repo rules, from orrery-init</text><text x="294" y="257.0" font-size="13.5" fill="#ac8f5f" text-anchor="end">~54 lines</text><rect x="16" y="305.0" width="290" height="77" rx="6" ry="6" fill="#ad7a2f22" stroke="#ad7a2f" stroke-width="1.2"/><text x="28" y="326.0" font-size="15" font-weight="600" fill="#dfe6ea">SessionStart hook</text><text x="28" y="344" font-size="13.5" fill="#8fa0aa">adoption gate, principal check,</text><text x="28" y="362" font-size="13.5" fill="#8fa0aa">plan-review cap</text><text x="294" y="326.0" font-size="13.5" fill="#ac8f5f" text-anchor="end">injected</text><rect x="16" y="392.0" width="290" height="77" rx="6" ry="6" fill="#9aa0b322" stroke="#9aa0b3" stroke-width="1.2"/><text x="28" y="413.0" font-size="15" font-weight="600" fill="#dfe6ea">development-orchestrator</text><text x="28" y="431" font-size="13.5" fill="#8fa0aa">the routing procedure, loaded on</text><text x="28" y="449" font-size="13.5" fill="#8fa0aa">demand</text><text x="294" y="413.0" font-size="13.5" fill="#ac8f5f" text-anchor="end">297 lines</text><rect x="16" y="479.0" width="290" height="59" rx="6" ry="6" fill="#ac8f5f22" stroke="#ac8f5f" stroke-width="1.2"/><text x="28" y="500.0" font-size="15" font-weight="600" fill="#dfe6ea">your prompt</text><text x="28" y="518" font-size="13.5" fill="#8fa0aa">verbatim, last</text><text x="294" y="500.0" font-size="13.5" fill="#ac8f5f" text-anchor="end">1 line</text><text x="16" y="558.0" font-size="14.5" fill="#8fa0aa">Roughly 721 lines of standing</text><text x="16" y="577.0" font-size="14.5" fill="#8fa0aa">instruction stand behind your one.</text></g>
<rect x="854" y="104.0" width="322" height="661.0" rx="10" ry="10" fill="#0f2733" stroke="#1d3440" stroke-width="1.5"/><text x="872" y="137.0" font-size="19" font-weight="600" fill="#dfe6ea">A delegated role receives</text><text x="872" y="160.0" font-size="14.5" fill="#8fa0aa">a separate process, fresh context</text>
<g transform="translate(854 104)"><rect x="16" y="80" width="290" height="77" rx="6" ry="6" fill="#6d8ba622" stroke="#6d8ba6" stroke-width="1.2"/><text x="28" y="101" font-size="15" font-weight="600" fill="#dfe6ea">the same standing policy</text><text x="28" y="119" font-size="13.5" fill="#8fa0aa">global and repository</text><text x="28" y="137" font-size="13.5" fill="#8fa0aa">instructions, unchanged</text><text x="294" y="101" font-size="13.5" fill="#ac8f5f" text-anchor="end">identical</text><rect x="16" y="167.0" width="290" height="77" rx="6" ry="6" fill="#ad7a2f22" stroke="#ad7a2f" stroke-width="1.2"/><text x="28" y="188.0" font-size="15" font-weight="600" fill="#dfe6ea">SessionStart, silenced</text><text x="28" y="206" font-size="13.5" fill="#8fa0aa">“bounded, non-principal: follow</text><text x="28" y="224" font-size="13.5" fill="#8fa0aa">the handoff”</text><text x="294" y="188.0" font-size="13.5" fill="#ac8f5f" text-anchor="end">injected</text><rect x="16" y="254.0" width="290" height="228" rx="6" ry="6" fill="#ac8f5f18" stroke="#ac8f5f" stroke-width="1.4"/><text x="28" y="277.0" font-size="15" font-weight="600" fill="#ac8f5f">ORRERY ROLE HANDOFF</text><text x="34" y="300.0" font-size="13.5" fill="#8fa0aa">· Role: &lt;id&gt;</text><text x="34" y="319.0" font-size="13.5" fill="#8fa0aa">· bounded, non-principal: do not</text><text x="34" y="338.0" font-size="13.5" fill="#8fa0aa">  delegate or spawn</text><text x="34" y="357.0" font-size="13.5" fill="#8fa0aa">· access: read-only, or</text><text x="34" y="376.0" font-size="13.5" fill="#8fa0aa">  workspace-write</text><text x="34" y="395.0" font-size="13.5" fill="#8fa0aa">· comment contract (read-only roles</text><text x="34" y="414.0" font-size="13.5" fill="#8fa0aa">  only)</text><text x="34" y="433.0" font-size="13.5" fill="#8fa0aa">· report style, from the manifest's</text><text x="34" y="452.0" font-size="13.5" fill="#8fa0aa">  verbosity dial</text><text x="34" y="471.0" font-size="13.5" fill="#dfe6ea">· the assignment</text><rect x="16" y="492.0" width="290" height="77" rx="6" ry="6" fill="#9aa0b322" stroke="#9aa0b3" stroke-width="1.2"/><text x="28" y="513.0" font-size="15" font-weight="600" fill="#dfe6ea">provider flags</text><text x="28" y="531" font-size="13.5" fill="#8fa0aa">model, thinking, sandbox, no</text><text x="28" y="549" font-size="13.5" fill="#8fa0aa">fallback ladder</text><text x="294" y="513.0" font-size="13.5" fill="#ac8f5f" text-anchor="end">argv</text><text x="16" y="599.0" font-size="14.5" fill="#8fa0aa">It never sees your words, only the</text><text x="16" y="618.0" font-size="14.5" fill="#8fa0aa">bounded assignment. It cannot</text><text x="16" y="637.0" font-size="14.5" fill="#8fa0aa">delegate further.</text></g>
<path d="M362 434.5L417 434.5" stroke="#ac8f5f" stroke-width="1.6" fill="none"/><path d="M426 434.5l-9 -4.5v9z" fill="#ac8f5f"/><text x="410" y="424.5" font-size="13.5" fill="#ac8f5f" text-anchor="end">wrapped</text>
<path d="M776 434.5L831 434.5" stroke="#ac8f5f" stroke-width="1.6" fill="none"/><path d="M840 434.5l-9 -4.5v9z" fill="#ac8f5f"/><text x="824" y="424.5" font-size="13.5" fill="#ac8f5f" text-anchor="end">bounded</text>
</svg>
