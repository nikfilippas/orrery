<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1268 564" width="1268" height="564" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="What Orrery sends: one typed prompt, the standing instruction a principal session already carries, and the bounded handoff a delegated role receives instead of the user's words">
<rect width="1268" height="564" fill="#0c2029"/>
<text x="28" y="40" font-size="20" font-weight="600" fill="#dfe6ea">What actually reaches the model</text>
<text x="28" y="63" font-size="13" fill="#8fa0aa">Read from the installed kit at build time. One typed line arrives wrapped in standing instruction; a delegate never sees the typed line at all.</text>
<rect x="28" y="204.0" width="340" height="214" rx="10" ry="10" fill="#0f2733" stroke="#1d3440" stroke-width="1.5"/><text x="46" y="234.0" font-size="16" font-weight="600" fill="#dfe6ea">You type</text><text x="46" y="255.0" font-size="12.5" fill="#8fa0aa">one line, in your own words</text>
<g transform="translate(28 204.0)"><rect x="16" y="74" width="308" height="52" rx="6" ry="6" fill="#16323f" stroke="#ac8f5f" stroke-width="1.3"/><text x="28" y="105" font-size="13.5" fill="#dfe6ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">add a --top flag with tests</text><text x="16" y="156" font-size="12" fill="#8fa0aa">That is the whole of your input.</text><text x="16" y="174" font-size="12" fill="#8fa0aa">Everything to the right is added</text><text x="16" y="192" font-size="12" fill="#8fa0aa">for you, and is the same every run.</text></g>
<rect x="464" y="108.0" width="340" height="406" rx="10" ry="10" fill="#0f2733" stroke="#1d3440" stroke-width="1.5"/><text x="482" y="138.0" font-size="16" font-weight="600" fill="#dfe6ea">The principal receives</text><text x="482" y="159.0" font-size="12.5" fill="#8fa0aa">your session, before it answers</text>
<g transform="translate(464 108.0)"><rect x="16" y="72" width="308" height="40" rx="6" ry="6" fill="#6d8ba622" stroke="#6d8ba6" stroke-width="1.2"/><text x="28" y="89" font-size="12.5" font-weight="600" fill="#dfe6ea">global/AGENTS.md</text><text x="28" y="104" font-size="10.5" fill="#8fa0aa">shared policy, via ~/.claude/AGENTS.md</text><text x="312" y="97" font-size="11" fill="#ac8f5f" text-anchor="end">370 lines</text><rect x="16" y="120" width="308" height="40" rx="6" ry="6" fill="#6d8ba622" stroke="#6d8ba6" stroke-width="1.2"/><text x="28" y="137" font-size="12.5" font-weight="600" fill="#dfe6ea">global/CLAUDE.md</text><text x="28" y="152" font-size="10.5" fill="#8fa0aa">a one-line @AGENTS.md import</text><text x="312" y="145" font-size="11" fill="#ac8f5f" text-anchor="end">1 line</text><rect x="16" y="168" width="308" height="40" rx="6" ry="6" fill="#88907f22" stroke="#88907f" stroke-width="1.2"/><text x="28" y="185" font-size="12.5" font-weight="600" fill="#dfe6ea">repository AGENTS.md</text><text x="28" y="200" font-size="10.5" fill="#8fa0aa">per-repo rules, from orrery-init</text><text x="312" y="193" font-size="11" fill="#ac8f5f" text-anchor="end">~54 lines</text><rect x="16" y="216" width="308" height="40" rx="6" ry="6" fill="#ad7a2f22" stroke="#ad7a2f" stroke-width="1.2"/><text x="28" y="233" font-size="12.5" font-weight="600" fill="#dfe6ea">SessionStart hook</text><text x="28" y="248" font-size="10.5" fill="#8fa0aa">adoption gate, principal check, plan-review cap</text><text x="312" y="241" font-size="11" fill="#ac8f5f" text-anchor="end">injected</text><rect x="16" y="264" width="308" height="40" rx="6" ry="6" fill="#9aa0b322" stroke="#9aa0b3" stroke-width="1.2"/><text x="28" y="281" font-size="12.5" font-weight="600" fill="#dfe6ea">development-orchestrator</text><text x="28" y="296" font-size="10.5" fill="#8fa0aa">the routing procedure, loaded on demand</text><text x="312" y="289" font-size="11" fill="#ac8f5f" text-anchor="end">297 lines</text><rect x="16" y="312" width="308" height="40" rx="6" ry="6" fill="#ac8f5f22" stroke="#ac8f5f" stroke-width="1.2"/><text x="28" y="329" font-size="12.5" font-weight="600" fill="#dfe6ea">your prompt</text><text x="28" y="344" font-size="10.5" fill="#8fa0aa">verbatim, last</text><text x="312" y="337" font-size="11" fill="#ac8f5f" text-anchor="end">1 line</text><text x="16" y="366" font-size="12" fill="#8fa0aa">Roughly 721 lines of standing</text><text x="16" y="384" font-size="12" fill="#8fa0aa">instruction stand behind your one.</text></g>
<rect x="900" y="92.0" width="340" height="438" rx="10" ry="10" fill="#0f2733" stroke="#1d3440" stroke-width="1.5"/><text x="918" y="122.0" font-size="16" font-weight="600" fill="#dfe6ea">A delegated role receives</text><text x="918" y="143.0" font-size="12.5" fill="#8fa0aa">a separate process, fresh context</text>
<g transform="translate(900 92.0)"><rect x="16" y="72" width="308" height="40" rx="6" ry="6" fill="#6d8ba622" stroke="#6d8ba6" stroke-width="1.2"/><text x="28" y="89" font-size="12.5" font-weight="600" fill="#dfe6ea">the same standing policy</text><text x="28" y="104" font-size="10.5" fill="#8fa0aa">global and repository instructions, unchanged</text><text x="312" y="97" font-size="11" fill="#ac8f5f" text-anchor="end">identical</text><rect x="16" y="120" width="308" height="40" rx="6" ry="6" fill="#ad7a2f22" stroke="#ad7a2f" stroke-width="1.2"/><text x="28" y="137" font-size="12.5" font-weight="600" fill="#dfe6ea">SessionStart, silenced</text><text x="28" y="152" font-size="10.5" fill="#8fa0aa">“bounded, non-principal: follow the handoff”</text><text x="312" y="145" font-size="11" fill="#ac8f5f" text-anchor="end">injected</text><rect x="16" y="168" width="308" height="148" rx="6" ry="6" fill="#ac8f5f18" stroke="#ac8f5f" stroke-width="1.4"/><text x="28" y="189" font-size="12.5" font-weight="600" fill="#ac8f5f">ORRERY ROLE HANDOFF</text><text x="36" y="211" font-size="11" fill="#8fa0aa">· Role: &lt;id&gt;</text><text x="36" y="229" font-size="11" fill="#8fa0aa">· bounded, non-principal: do not delegate or spawn</text><text x="36" y="247" font-size="11" fill="#8fa0aa">· access: read-only, or workspace-write</text><text x="36" y="265" font-size="11" fill="#8fa0aa">· comment contract (read-only roles only)</text><text x="36" y="283" font-size="11" fill="#8fa0aa">· report style, from the manifest's verbosity dial</text><text x="36" y="301" font-size="11" fill="#dfe6ea">· the assignment</text><rect x="16" y="330" width="308" height="40" rx="6" ry="6" fill="#9aa0b322" stroke="#9aa0b3" stroke-width="1.2"/><text x="28" y="347" font-size="12.5" font-weight="600" fill="#dfe6ea">provider flags</text><text x="28" y="362" font-size="10.5" fill="#8fa0aa">model, thinking, sandbox, no fallback ladder</text><text x="312" y="355" font-size="11" fill="#ac8f5f" text-anchor="end">argv</text><text x="16" y="398" font-size="12" fill="#8fa0aa">It never sees your words, only the bounded</text><text x="16" y="416" font-size="12" fill="#8fa0aa">assignment. It cannot delegate further.</text></g>
<path d="M384 311.0L439 311.0" stroke="#ac8f5f" stroke-width="1.6" fill="none"/><path d="M448 311.0l-9 -4.5v9z" fill="#ac8f5f"/><text x="432" y="302.0" font-size="11" fill="#ac8f5f" text-anchor="end">wrapped</text>
<path d="M820 311.0L875 311.0" stroke="#ac8f5f" stroke-width="1.6" fill="none"/><path d="M884 311.0l-9 -4.5v9z" fill="#ac8f5f"/><text x="868" y="302.0" font-size="11" fill="#ac8f5f" text-anchor="end">bounded</text>
</svg>
