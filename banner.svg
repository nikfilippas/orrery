    <path d="M1072.1 549.6A374 374 0 1 1 1002.2 476.8"/>
    <path d="M249.5 719.4A523 523 0 1 1 1176.1 1099.6M1088.5 1184.8A523 523 0 0 1 249.4 819.6"/>
    <path d="M395.9 268.1A626 626 0 1 1 304.7 351.2"/>
    <circle cx="770" cy="770" r="722"/>
  </g>

