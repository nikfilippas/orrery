  <!-- the disc the mark is cut to -->

  <!-- Four orbits, each broken just short of the sphere riding on it, so
       the sphere reads as being in front of the line rather than on it.
       The break clears the sphere by a quarter of its radius, which is what
       the drawing does. The knots are not broken around: the orbit runs
       straight through them. -->
