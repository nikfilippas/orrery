name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to the version used for local verification, so a ruff
      # release can never turn a locally green tree red in CI.
      - run: pip install ruff==0.13.3
      # `ruff check .` walks the tree by extension and never sees the
      # extensionless CLI entry points, so a dead import in one of them
      # shipped unlinted. Discover them by their python shebang and lint
      # them alongside the rest; new entry points are covered
      # automatically.
      - name: Lint
        run: |
          entry=()
          for f in scripts/*; do
            [ -f "$f" ] || continue
            case "$f" in *.py|*.sh) continue;; esac
            head -1 "$f" | grep -q python && entry+=("$f")
          done
          ruff check . "${entry[@]}"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The suite drives real transient units, which needs the runner's
      # systemd user manager and its bus to exist.
      - name: Enable the systemd user manager
        run: |
          sudo loginctl enable-linger "$(whoami)"
          for _ in $(seq 1 30); do
            [ -S "/run/user/$(id -u)/bus" ] && break
            sleep 1
          done
          test -S "/run/user/$(id -u)/bus"
      - name: Run the suite
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          git config --global user.email ci@invalid
          git config --global user.name CI
          ./tests/run-tests.py
